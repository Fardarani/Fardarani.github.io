name: Update Citation Counts

on:
  workflow_dispatch:

jobs:
  update-citations:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update citation count
        run: |
          python - <<'PY'
          import json
          import urllib.request

          file_path = "assets/data/publications.json"

          with open(file_path, "r", encoding="utf-8") as f:
              publications = json.load(f)

          for publication in publications:
              doi = publication.get("doi")

              if not doi:
                  continue

              url = "https://api.openalex.org/works/https://doi.org/" + doi

              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      data = json.load(response)

                  citation_count = data.get("cited_by_count", 0)
                  publication["citations"] = citation_count

                  print(f"{doi} -> {citation_count} citations")

              except Exception as e:
                  print(f"Error processing {doi}: {e}")

          with open(file_path, "w", encoding="utf-8") as f:
              json.dump(publications, f, ensure_ascii=False, indent=2)

          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/publications.json

          if git diff --cached --quiet; then
            echo "No citation changes."
          else
            git commit -m "Update citation counts"
            git push
          fi
