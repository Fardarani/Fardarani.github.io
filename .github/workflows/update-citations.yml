name: Update Citation Counts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  update-citations:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update citation count
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import traceback

          file_path = "assets/data/publications.json"

          print("Reading publications.json...")

          with open(file_path, "r", encoding="utf-8") as f:
              publications = json.load(f)

          print(f"Found {len(publications)} publications.")

          for i, publication in enumerate(publications, start=1):
              doi = publication.get("doi")

              if not doi:
                  print(f"[{i}] No DOI - skipped")
                  continue

              print(f"[{i}] Processing DOI: {doi}")

              url = "https://api.openalex.org/works/https://doi.org/" + doi

              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      data = json.load(response)

                  citation_count = data.get("cited_by_count", 0)
                  publication["citations"] = citation_count

                  print(f"[{i}] SUCCESS: {doi} -> {citation_count} citations")

              except Exception as e:
                  print(f"[{i}] ERROR: {doi}")
                  print(f"Error type: {type(e).__name__}")
                  print(f"Error message: {e}")
                  traceback.print_exc()

          with open(file_path, "w", encoding="utf-8") as f:
              json.dump(
                  publications,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Finished updating citation counts.")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/publications.json

          if git diff --cached --quiet; then
            echo "No citation changes."
          else
            git commit -m "Update citation counts"
            git pull --rebase origin main
            git push origin main
          fi
